<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    :root {
      --bar-color: #f4f4f2;
      --bg-color: #141415;
      --core-color: #fcb900;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bar-color: #141415;
        --bg-color: #f6f6f4;
        --core-color: #ff6900;
      }
    }
    .bg { fill: var(--bg-color); rx: 10px; }
    .bar { fill: var(--bar-color); }
    .core { fill: var(--core-color); }
  </style>
  <rect width="48" height="48" class="bg"/>
  <!-- VSL Orthogonal Monolith Mark -->
  <!-- 1. Left Mast of 'V' -->
  <rect x="7" y="7" width="6.5" height="25" rx="1.2" class="bar"/>
  <!-- 2. Bottom connector of 'V' -->
  <rect x="7" y="26" width="16.5" height="6" rx="1.2" class="bar"/>
  <!-- 3. Center Pillar of 'V' & 'L' -->
  <rect x="17" y="12" width="6.5" height="29" rx="1.2" class="bar"/>
  <!-- 4. Top Beam of 'S' -->
  <rect x="17" y="7" width="24" height="6.5" rx="1.2" class="bar"/>
  <!-- 5. Mid Wing of 'S' -->
  <rect x="27.5" y="17.5" width="13.5" height="6.5" rx="1.2" class="bar"/>
  <!-- 6. Amber Core Nexus of 'S' / 'L' -->
  <rect x="27.5" y="27.5" width="13.5" height="13.5" rx="2" class="core"/>
</svg>