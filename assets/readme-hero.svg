<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Vivek's SiteLabs — Autonomous AI Systems and Engineering Showcase Hub">
  <defs>
    <!-- Authentic Graphite Matte Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#2e2e30"/>
      <stop offset="100%" stop-color="#222224"/>
    </linearGradient>

    <!-- Subtle Ambient Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcb900" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#fcb900" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#fcb900" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcb900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fcb900" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fcb900" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Blueprint Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <!-- Fine Ruler Ticks Pattern -->
    <pattern id="rulerTicks" width="20" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <line x1="10" y1="4" x2="10" y2="10" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <!-- Clip Rounded Canvas -->
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="360" rx="16" ry="16"/>
    </clipPath>

    <style>
      .mono {
        font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }
      .serif {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
      @keyframes bracketGlow {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-40px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes steamRise1 {
        0% { transform: translateY(14px) scale(0.85); opacity: 0; }
        40% { opacity: 0.32; }
        100% { transform: translateY(-34px) scale(1.2); opacity: 0; }
      }
      @keyframes steamRise2 {
        0% { transform: translateY(18px) scale(0.9); opacity: 0; }
        45% { opacity: 0.24; }
        100% { transform: translateY(-42px) scale(1.3); opacity: 0; }
      }
      .pulse-dot {
        transform-origin: center;
        transform-box: fill-box;
        animation: pulseDot 2.2s ease-in-out infinite;
      }
      .bracket {
        animation: bracketGlow 4s ease-in-out infinite;
      }
      .scanline {
        animation: scanSweep 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .logo-float {
        animation: floatSlow 5.5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.6s linear infinite;
      }
      .steam-1 { animation: steamRise1 4.2s ease-out infinite; }
      .steam-2 { animation: steamRise2 5.4s ease-out infinite 1.4s; }
    </style>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <!-- Base Surface & Grid -->
    <rect width="1200" height="360" fill="url(#bgGrad)"/>
    <rect width="1200" height="360" fill="url(#gridPattern)"/>

    <!-- Ambient Atmospheric Glows -->
    <ellipse cx="600" cy="180" rx="460" ry="180" fill="url(#amberGlow)"/>
    <ellipse cx="1020" cy="90" rx="260" ry="150" fill="url(#cyanGlow)"/>

    <!-- Subtle Coffee Steam Wisps (Bottom Left Graphite Signature) -->
    <g opacity="0.7">
      <path class="steam-1" d="M 88 320 C 78 295, 102 275, 90 250" fill="none" stroke="#f4f4f2" stroke-width="2.5" stroke-linecap="round"/>
      <path class="steam-2" d="M 104 325 C 115 298, 92 278, 106 248" fill="none" stroke="#f4f4f2" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Animated Blueprint Scanline -->
    <rect class="scanline" x="0" y="0" width="1200" height="28" fill="url(#scanBeam)"/>

    <!-- Top Precision Ruler -->
    <rect x="44" y="20" width="1112" height="10" fill="url(#rulerTicks)"/>
    <line x1="44" y1="30" x2="1156" y2="30" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Top Telemetry Bar -->
    <g class="mono" font-size="11" letter-spacing="2.2" fill="#a9a9a5">
      <text x="48" y="54">INDEX 00 // GRAPHITE SPECIFICATION 2026</text>
      <text x="600" y="54" text-anchor="middle" fill="#9e9e9a">( ENGINEERING LAB · NEW DELHI )</text>
      <g transform="translate(968, 43)">
        <circle class="pulse-dot" cx="6" cy="6" r="4" fill="#7bdcb5"/>
        <text x="18" y="10" fill="#f4f4f2" font-weight="600">29 REPOS LIVE</text>
      </g>
    </g>

    <!-- Viewfinder Frame Brackets (Graphite Hero Studio Aesthetic) -->
    <g class="bracket" stroke="#f4f4f2" stroke-width="1.5" fill="none">
      <!-- Top-Left -->
      <path d="M 160 108 L 160 88 L 182 88"/>
      <!-- Top-Right -->
      <path d="M 1018 88 L 1040 88 L 1040 108"/>
      <!-- Bottom-Left -->
      <path d="M 160 258 L 160 278 L 182 278"/>
      <!-- Bottom-Right -->
      <path d="M 1018 278 L 1040 278 L 1040 258"/>
    </g>

    <!-- Viewfinder Inner Metadata -->
    <g class="mono" font-size="10.5" letter-spacing="2.5" fill="#9e9e9a">
      <text x="194" y="104">( WEB STUDIO )</text>
      <text x="600" y="104" text-anchor="middle">AI &amp; SYSTEMS LAB</text>
      <text x="1006" y="104" text-anchor="end">EST. 2026</text>
    </g>

    <!-- Animated Connecting Hairlines -->
    <line class="flow-line" x1="194" y1="118" x2="1006" y2="118" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Center Brand Mark + Wordmark -->
    <g class="logo-float">
      <!-- Geometric Monogram Badge -->
      <g transform="translate(226, 137)">
        <rect x="0" y="0" width="54" height="54" rx="12" fill="#1c1c1e" stroke="#fcb900" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M 14 16 L 27 40 L 40 16" fill="none" stroke="#f4f4f2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="27" cy="18" r="3" fill="#fcb900"/>
      </g>

      <!-- Main Hero Title -->
      <text x="300" y="182" class="sans" font-size="60" font-weight="800" letter-spacing="-2" fill="#f4f4f2">
        Vivek's SiteLabs<tspan fill="#fcb900">.</tspan>
      </text>
    </g>

    <!-- Editorial Italic Subtitle -->
    <text x="600" y="226" text-anchor="middle" class="serif" font-size="25" fill="#d4d4d0" letter-spacing="0.4">
      Autonomous AI Systems, Multi-Agent RAG &amp; Precision Engineering Hub.
    </text>

    <!-- Pill Badges Inside Viewfinder -->
    <g transform="translate(310, 245)" class="mono" font-size="10.5" letter-spacing="1.4">
      <rect x="0" y="0" width="136" height="24" rx="4" fill="#242426" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="68" y="16" text-anchor="middle" fill="#f4f4f2">0 DEPENDENCIES</text>

      <rect x="148" y="0" width="136" height="24" rx="4" fill="#242426" stroke="#fcb900" stroke-opacity="0.45"/>
      <text x="216" y="16" text-anchor="middle" fill="#fcb900">GRAPHITE UI</text>

      <rect x="296" y="0" width="136" height="24" rx="4" fill="#242426" stroke="#7bdcb5" stroke-opacity="0.45"/>
      <text x="364" y="16" text-anchor="middle" fill="#7bdcb5">SEO + A11Y 100</text>

      <rect x="444" y="0" width="136" height="24" rx="4" fill="#242426" stroke="#00d2ff" stroke-opacity="0.45"/>
      <text x="512" y="16" text-anchor="middle" fill="#00d2ff">VERCEL EDGE</text>
    </g>

    <!-- Bottom Coordinate Footer Bar -->
    <line x1="44" y1="316" x2="1156" y2="316" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <g class="mono" font-size="10.5" letter-spacing="1.8" fill="#848480">
      <text x="48" y="338">GRID [A1..D8] // 029 PROJECTS</text>
      <text x="600" y="338" text-anchor="middle" fill="#a9a9a5">VANILLA HTML5 · CSS3 · ES6+ ENGINE</text>
      <text x="1152" y="338" text-anchor="end">AUTHOR // VIVEK CHAURASIYA</text>
    </g>

    <!-- Outer Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="16" ry="16" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  </g>
</svg>

