<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none" class="sitelabs-logo">
  <g transform="translate(2, 2)">
    <!-- Emblem Mark -->
    <rect x="4" y="4" width="7" height="40" rx="1.5" fill="currentColor"/>
    <rect x="15" y="4" width="27" height="7" rx="1.5" fill="currentColor"/>
    <rect x="15" y="15" width="7" height="29" rx="1.5" fill="currentColor"/>
    <rect x="26" y="15" width="16" height="7" rx="1.5" fill="currentColor"/>
    <rect x="26" y="26" width="16" height="18" rx="2" fill="#fcb900"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="32" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.04em" fill="currentColor">SITELABS</text>
  <text x="180" y="32" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-weight="400" font-size="24" fill="currentColor">.</text>
  <!-- Secondary Blueprint Tag -->
  <text x="65" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="0.16em" fill="#8a8a86">ORTHOGONAL // SPEC 2026</text>
</svg>